name: Deploy BimmerSpot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t bimmerspot:latest .

      - name: Deploy BimmerSpot
        run: |
          cd /srv
          docker-compose up -d --no-build bimmerspot